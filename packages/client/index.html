<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111722">
  <title>ITHARBORS</title>
  <style>
    :root {
      --app-viewport-height: 100vh;
      --app-viewport-safe-top: env(safe-area-inset-top, 0px);
    }
    @supports (height: 100svh) {
      :root { --app-viewport-height: 100svh; }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111722;
      color: #d4d4d4;
    }
    #app {
      position: fixed;
      top: var(--app-viewport-top, 0px);
      left: 0;
      width: 100vw;
      height: var(--app-viewport-height);
      box-sizing: border-box;
      padding-top: var(--app-viewport-safe-top);
      overflow: clip;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    (() => {
      const syncViewportHeight = () => {
        const viewport = window.visualViewport;
        const height = viewport?.height ?? window.innerHeight;
        let active = document.activeElement;
        while (active?.shadowRoot?.activeElement) active = active.shadowRoot.activeElement;
        const editing = active && (active.matches('input, textarea, select, iframe') || active.isContentEditable);
        const top = editing && viewport && viewport.scale === 1 ? viewport.offsetTop : 0;
        document.documentElement.style.setProperty('--app-viewport-height', `${Math.round(height)}px`);
        document.documentElement.style.setProperty('--app-viewport-top', `${Math.round(top)}px`);
      };
      syncViewportHeight();
      window.visualViewport?.addEventListener('resize', syncViewportHeight);
      window.visualViewport?.addEventListener('scroll', syncViewportHeight);
      window.addEventListener('resize', syncViewportHeight);
      document.addEventListener('focusin', syncViewportHeight);
      document.addEventListener('focusout', () => setTimeout(syncViewportHeight, 0));
    })();
  </script>
  <script type="module" src="/src/index.ts"></script>
</body>
</html>
