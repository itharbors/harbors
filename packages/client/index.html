<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111722">
  <title>ITHARBORS</title>
  <style>
    :root {
      --app-viewport-height: 100vh;
      --app-viewport-safe-top: 0px;
    }
    @supports (height: 100svh) {
      :root { --app-viewport-height: 100svh; }
    }
    @media (orientation: landscape) and (any-pointer: coarse) {
      :root { --app-viewport-safe-top: max(20px, env(safe-area-inset-top, 0px)); }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111722;
      color: #d4d4d4;
    }
    #app {
      width: 100vw;
      height: var(--app-viewport-height);
      box-sizing: border-box;
      padding-top: var(--app-viewport-safe-top);
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    (() => {
      const syncViewportHeight = () => {
        const height = window.visualViewport?.height ?? window.innerHeight;
        document.documentElement.style.setProperty('--app-viewport-height', `${Math.round(height)}px`);
      };
      syncViewportHeight();
      window.visualViewport?.addEventListener('resize', syncViewportHeight);
      window.addEventListener('resize', syncViewportHeight);
    })();
  </script>
  <script type="module" src="/src/index.ts"></script>
</body>
</html>
