<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Chat</title>
    <style>
      :root { color-scheme: dark; background: #171a21; }
      :root { --kit-viewport-height: 100svh; }
      html, body, #app { width: 100%; height: var(--kit-viewport-height); min-height: 0; margin: 0; overflow: hidden; background: #171a21; }
      editor-app { display: block; width: 100%; height: 100%; min-height: 0; }
      *, *::before, *::after { box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="app">
      <editor-app></editor-app>
    </div>
    <script>
      (() => {
        const syncViewportHeight = () => {
          const height = window.visualViewport?.height ?? window.innerHeight;
          document.documentElement.style.setProperty('--kit-viewport-height', `${Math.round(height)}px`);
        };
        syncViewportHeight();
        window.visualViewport?.addEventListener('resize', syncViewportHeight);
        window.addEventListener('resize', syncViewportHeight);
      })();
    </script>
    <script type="module" src="/assets/index.js"></script>
  </body>
</html>
