name: Publish Kit reusable

on:
  workflow_call:
    inputs:
      release-tag:
        description: Exact immutable Kit release Tag
        required: true
        type: string

# GitHub Release immutability must be enabled as a repository setting before activation.
# This workflow rejects existing Releases and never attempts to change that setting.

jobs:
  context:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release-ref: ${{ steps.identity.outputs.release-ref }}
      release-commit: ${{ steps.source.outputs.release-commit }}
      slug: ${{ steps.policy.outputs.slug }}
      version: ${{ steps.policy.outputs.version }}
      channel: ${{ steps.policy.outputs.channel }}
      runner: ${{ steps.policy.outputs.runner }}
      kit-id: ${{ steps.policy.outputs.kit-id }}
      label: ${{ steps.policy.outputs.label }}
      summary: ${{ steps.policy.outputs.summary }}
      tag: ${{ steps.policy.outputs.tag }}
    steps:
      - name: Resolve exact Kit Tag
        id: identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^kit/[a-z0-9]+(-[a-z0-9]+)*/v[0-9A-Za-z.-]+$ ]]; then
            echo "Publication requires an exact canonical Kit Tag" >&2
            exit 1
          fi
          echo "release-ref=refs/tags/$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable v4 publisher
        uses: actions/checkout@v6
        with:
          ref: refs/tags/kit-publish-v4
          path: publisher
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact Kit Tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.identity.outputs.release-ref }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Require Tag Commit on main
        id: source
        shell: bash
        working-directory: source
        env:
          RELEASE_REF: ${{ steps.identity.outputs.release-ref }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$RELEASE_REF")" = commit
          release_commit="$(git rev-parse --verify "$RELEASE_REF^{commit}")"
          git fetch --no-tags origin main
          git rev-parse --verify origin/main
          git merge-base --is-ancestor "$release_commit" origin/main
          echo "release-commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          package-manager-cache: false

      - name: Pin npm
        run: |
          npm install --global npm@10.9.3
          test "$(npm --version)" = 10.9.3

      - name: Build strict policy loader
        working-directory: publisher
        run: |
          npm ci --ignore-scripts
          npm run build -w @itharbors/kit-core

      - name: Validate Tag and official Kit policy
        id: policy
        shell: bash
        working-directory: publisher
        env:
          PUBLISHER_POLICY: ${{ github.workspace }}/publisher/registry/policy.json
          PRODUCT_SOURCE: ${{ github.workspace }}/source
          RELEASE_REF: ${{ steps.identity.outputs.release-ref }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import semver from 'semver';
          import { loadTrustedMarketKit } from './scripts/lib/kit-monorepo.mjs';

          const match = /^refs\/tags\/kit\/([a-z0-9][a-z0-9-]*)\/v(.+)$/u.exec(process.env.RELEASE_REF);
          if (!match) throw new Error('Publication requires exact refs/tags/kit/{slug}/v{version}');
          const [, slug, version] = match;
          if (semver.valid(version) !== version || version.includes('+')) {
            throw new Error('Publication Tag version must be canonical SemVer without build metadata');
          }
          const kit = await loadTrustedMarketKit({
            repositoryRoot: process.env.PRODUCT_SOURCE,
            policyFile: process.env.PUBLISHER_POLICY,
            slug,
          });
          if (kit.id !== `@itharbors/kit-${slug}` || kit.manifest.version !== version) {
            throw new Error('Tag, Kit manifest, package, and policy identities must match');
          }
          const prerelease = semver.prerelease(version);
          if (
            (kit.manifest.channel === 'preview' && prerelease === null)
            || (kit.manifest.channel === 'stable' && prerelease !== null)
          ) throw new Error('Kit channel must match the Tag SemVer channel');

          const values = {
            slug,
            version,
            channel: kit.manifest.channel,
            runner: kit.ciRunner,
            'kit-id': kit.id,
            label: kit.label,
            summary: kit.summary,
            tag: process.env.RELEASE_TAG,
          };
          const unsafeOutput = /[\u0000-\u001f\u007f-\u009f\u2028\u2029]/u;
          for (const [key, value] of Object.entries(values)) {
            if (typeof value !== 'string' || value.length === 0 || unsafeOutput.test(value)) {
              throw new Error(`Unsafe GitHub output value: ${key}`);
            }
            appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`, 'utf8');
          }
          NODE

  prepare:
    needs: context
    runs-on: ${{ needs.context.outputs.runner }}
    permissions:
      contents: read
    env:
      KIT_NAME: ${{ needs.context.outputs.slug }}
    steps:
      - name: Checkout exact Kit Tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.context.outputs.release-ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          package-manager-cache: false

      - name: Pin npm
        run: |
          npm install --global npm@10.9.3
          test "$(npm --version)" = 10.9.3

      - name: Install locked dependencies
        run: npm ci

      - name: Audit targeted Kit architecture
        shell: bash
        run: npm run kits:boundary -- "$KIT_NAME"

      - name: Run the targeted Kit check
        shell: bash
        run: npm run kit:check -- "$KIT_NAME" --output-directory "$RUNNER_TEMP/kit-check"

      - name: Resolve targeted check artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, readdirSync } from 'node:fs';
          import path from 'node:path';

          const directory = `${process.env.RUNNER_TEMP}/kit-check`;
          const artifacts = readdirSync(directory, { withFileTypes: true })
            .filter((entry) => entry.isFile() && entry.name.endsWith('.hkit'));
          if (artifacts.length === 0) {
            throw new Error('Targeted Kit check must produce at least one .hkit');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `kit-artifacts-directory=${directory}\n`, 'utf8');
          NODE

      - name: Inspect targeted check artifacts
        shell: bash
        run: |
          set -euo pipefail
          for kit_artifact in "$RUNNER_TEMP"/kit-check/*.hkit; do
            node packages/kit-cli/dist/cli.js inspect "$kit_artifact" --json >/dev/null
          done

      - name: Transfer checked Kit artifact
        uses: actions/upload-artifact@v7
        with:
          name: kit-checked-artifact
          path: ${{ steps.artifact.outputs.kit-artifacts-directory }}/*.hkit
          if-no-files-found: error
          retention-days: 1

  package:
    needs: [context, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ needs.context.outputs.channel }}
      tag: ${{ needs.context.outputs.tag }}
      version: ${{ needs.context.outputs.version }}
    env:
      KIT_ID: ${{ needs.context.outputs.kit-id }}
      EXPECTED_CHANNEL: ${{ needs.context.outputs.channel }}
      EXPECTED_VERSION: ${{ needs.context.outputs.version }}
      RELEASE_COMMIT: ${{ needs.context.outputs.release-commit }}
      RELEASE_REF: ${{ needs.context.outputs.release-ref }}
      RELEASE_TAG: ${{ needs.context.outputs.tag }}
    steps:
      - name: Checkout immutable v4 publisher
        uses: actions/checkout@v6
        with:
          ref: refs/tags/kit-publish-v4
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          package-manager-cache: false

      - name: Pin npm
        run: |
          npm install --global npm@10.9.3
          test "$(npm --version)" = 10.9.3

      - name: Build immutable publication tooling
        run: |
          npm ci --ignore-scripts
          npm run build -w @itharbors/kit-core
          npm run build -w @itharbors/kit-cli

      - name: Download checked Kit artifact
        uses: actions/download-artifact@v8
        with:
          name: kit-checked-artifact
          path: ${{ runner.temp }}/kit-check

      - name: Resolve checked Kit artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, readdirSync } from 'node:fs';
          import path from 'node:path';

          const directory = `${process.env.RUNNER_TEMP}/kit-check`;
          const artifacts = readdirSync(directory, { withFileTypes: true })
            .filter((entry) => entry.isFile() && entry.name.endsWith('.hkit'));
          if (artifacts.length === 0) {
            throw new Error('Checked transfer must contain at least one .hkit');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `kit-artifacts-directory=${directory}\n`, 'utf8');
          NODE

      - name: Inspect checked Kit artifacts
        shell: bash
        run: |
          set -euo pipefail
          for kit_artifact in "$RUNNER_TEMP"/kit-check/*.hkit; do
            node packages/kit-cli/dist/cli.js inspect "$kit_artifact" --json >/dev/null
          done

      - name: Prepare publication bundle
        id: package
        shell: bash
        env:
          KIT_LABEL: ${{ needs.context.outputs.label }}
          KIT_SUMMARY: ${{ needs.context.outputs.summary }}
          KIT_ARTIFACTS_DIRECTORY: ${{ steps.artifact.outputs.kit-artifacts-directory }}
        run: |
          set -euo pipefail
          node scripts/kit-publish.mjs prepare \
            --kit-artifacts-directory "$KIT_ARTIFACTS_DIRECTORY" \
            --output-directory "$RUNNER_TEMP/kit-release" \
            --kit-id "$KIT_ID" \
            --kit-version "$EXPECTED_VERSION" \
            --kit-channel "$EXPECTED_CHANNEL" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$RELEASE_COMMIT" \
            --workflow "$GITHUB_REPOSITORY/.github/workflows/publish-kit.yml@$RELEASE_REF" \
            --signer-workflow itharbors/harbors/.github/workflows/publish-kit-reusable.yml@refs/tags/kit-publish-v4 \
            --ref "$RELEASE_REF" \
            --tag "$RELEASE_TAG" \
            --label "$KIT_LABEL" \
            --summary "$KIT_SUMMARY" \
            | tee "$RUNNER_TEMP/prepare-output"

          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const lines = readFileSync(`${process.env.RUNNER_TEMP}/prepare-output`, 'utf8').trim().split('\n');
          const outputs = new Map();
          for (const line of lines) {
            const separator = line.indexOf('=');
            if (separator <= 0) throw new Error('Prepare output is malformed');
            const key = line.slice(0, separator);
            const value = line.slice(separator + 1);
            if (outputs.has(key) || /[\u0000-\u001f\u007f-\u009f\u2028\u2029]/u.test(value)) {
              throw new Error('Prepare output is unsafe');
            }
            outputs.set(key, value);
          }
          const expectedKeys = [
            'ARTIFACT_COUNT', 'CHANNEL', 'REGISTRY_ENTRY',
            'RELEASE_MANIFEST', 'SBOM_COUNT', 'TAG', 'VERSION',
          ];
          if (
            outputs.size !== expectedKeys.length
            || expectedKeys.some((key) => !outputs.has(key))
            || outputs.get('CHANNEL') !== process.env.EXPECTED_CHANNEL
            || outputs.get('TAG') !== process.env.RELEASE_TAG
            || outputs.get('VERSION') !== process.env.EXPECTED_VERSION
          ) throw new Error('Prepare outputs do not match validated Tag context');
          NODE

      - name: Inspect and verify prepared publication
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs';
          import { inspectKit } from '@itharbors/kit-cli';

          const temporary = process.env.RUNNER_TEMP;
          const release = JSON.parse(readFileSync(`${temporary}/kit-release/release.json`, 'utf8'));
          const entry = JSON.parse(readFileSync(`${temporary}/kit-release/registry-entry.json`, 'utf8'));
          const sourceArtifacts = readdirSync(`${temporary}/kit-check`)
            .filter((name) => name.endsWith('.hkit')).sort();
          const releaseArtifacts = readdirSync(`${temporary}/kit-release`)
            .filter((name) => name.endsWith('.hkit')).sort();
          const sboms = readdirSync(`${temporary}/kit-release`)
            .filter((name) => name.startsWith('sbom.') && name.endsWith('.spdx.json'));
          const expectedFiles = [
            ...releaseArtifacts, ...sboms, 'registry-entry.json', 'release.json',
          ].sort();
          const actualFiles = readdirSync(`${temporary}/kit-release`).sort();
          const inspections = await Promise.all(sourceArtifacts.map(async (name) => ({
            name,
            value: await inspectKit({ archive: `${temporary}/kit-check/${name}` }),
          })));
          if (
            JSON.stringify(sourceArtifacts) !== JSON.stringify(releaseArtifacts)
            || release.assets.length !== releaseArtifacts.length
            || sboms.length !== releaseArtifacts.length
            || inspections.some(({ name, value }) => {
              const asset = release.assets.find((candidate) => candidate.name === name);
              return !asset || asset.sha256 !== value.sha256;
            })
            || release.id !== process.env.KIT_ID
            || release.version !== process.env.EXPECTED_VERSION
            || release.channel !== process.env.EXPECTED_CHANNEL
            || entry.id !== process.env.KIT_ID
            || entry.version !== process.env.EXPECTED_VERSION
            || entry.channel !== process.env.EXPECTED_CHANNEL
            || JSON.stringify(actualFiles) !== JSON.stringify(expectedFiles)
          ) throw new Error('Tag, Kit manifest, package, and artifact versions must match');
          NODE

      - name: Transfer publication bundle
        uses: actions/upload-artifact@v7
        with:
          name: kit-publication
          path: ${{ runner.temp }}/kit-release
          if-no-files-found: error
          retention-days: 1

  publish-preview:
    if: needs.context.outputs.channel == 'preview'
    needs: [context, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download publication bundle
        uses: actions/download-artifact@v8
        with:
          name: kit-publication
          path: ${{ runner.temp }}/kit-release

      - name: Require missing Preview Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.context.outputs.tag }}
        run: |
          set -euo pipefail
          release_error="$RUNNER_TEMP/release.err"
          set +e
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>"$release_error"
          release_status=$?
          set -e
          if [[ "$release_status" -eq 0 ]]; then
            echo "Release already exists: $TAG" >&2
            exit 1
          fi
          if ! grep -Fq '(HTTP 404)' "$release_error"; then
            cat "$release_error" >&2
            exit "$release_status"
          fi

      - name: Attest Kit and Release manifest
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ runner.temp }}/kit-release/*.hkit
            ${{ runner.temp }}/kit-release/release.json

      - name: Create immutable Preview Release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          KIT_LABEL: ${{ needs.context.outputs.label }}
          RELEASE_COMMIT: ${{ needs.context.outputs.release-commit }}
          TAG: ${{ needs.context.outputs.tag }}
          VERSION: ${{ needs.context.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "$RUNNER_TEMP"/kit-release/* \
            --verify-tag \
            --prerelease \
            --title "$KIT_LABEL $VERSION Preview" \
            --notes "Automated immutable Kit Preview from $RELEASE_COMMIT."

  publish-stable:
    if: needs.context.outputs.channel == 'stable'
    needs: [context, package]
    runs-on: ubuntu-latest
    environment:
      name: kit-stable
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download publication bundle
        uses: actions/download-artifact@v8
        with:
          name: kit-publication
          path: ${{ runner.temp }}/kit-release

      - name: Require missing Stable Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.context.outputs.tag }}
        run: |
          set -euo pipefail
          release_error="$RUNNER_TEMP/release.err"
          set +e
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>"$release_error"
          release_status=$?
          set -e
          if [[ "$release_status" -eq 0 ]]; then
            echo "Release already exists: $TAG" >&2
            exit 1
          fi
          if ! grep -Fq '(HTTP 404)' "$release_error"; then
            cat "$release_error" >&2
            exit "$release_status"
          fi

      - name: Attest Kit and Release manifest
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ runner.temp }}/kit-release/*.hkit
            ${{ runner.temp }}/kit-release/release.json

      - name: Create immutable Stable Release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          KIT_LABEL: ${{ needs.context.outputs.label }}
          RELEASE_COMMIT: ${{ needs.context.outputs.release-commit }}
          TAG: ${{ needs.context.outputs.tag }}
          VERSION: ${{ needs.context.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "$RUNNER_TEMP"/kit-release/* \
            --verify-tag \
            --title "$KIT_LABEL $VERSION" \
            --notes "Reviewed immutable Kit Release from $RELEASE_COMMIT."

  publish-registry:
    needs: [publish-preview, publish-stable]
    if: ${{ always() && ((needs.publish-preview.result == 'success' && needs.publish-stable.result == 'skipped') || (needs.publish-stable.result == 'success' && needs.publish-preview.result == 'skipped')) }}
    permissions:
      contents: read
      attestations: read
      pages: write
      id-token: write
    uses: itharbors/harbors/.github/workflows/publish-kit-registry.yml@kit-publish-v4
    secrets: inherit
