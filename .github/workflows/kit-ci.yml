name: Kit CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kit-change-boundary:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'kit-change/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full comparison history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce declared Kit diff boundary
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_REF" =~ ^kit-change/([a-z0-9]+(-[a-z0-9]+)*)/(feature|bug|docs|refactor|optimize|test|chore)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo 'Kit change branch name is not canonical' >&2
            exit 1
          fi
          declared_kit="${BASH_REMATCH[1]}"
          test -f "kits/$declared_kit/kit.json"
          npm run kit:boundary -- "$declared_kit" --base "$BASE_SHA" --head "$HEAD_SHA"

  select:
    runs-on: ubuntu-latest
    outputs:
      matrix-json: ${{ steps.selection.outputs.matrix-json }}
      has-kits: ${{ steps.selection.outputs.has-kits }}
      base-sha: ${{ steps.selection.outputs.base-sha }}
      head-sha: ${{ steps.selection.outputs.head-sha }}
    steps:
      - name: Checkout full comparison history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Build selector dependency
        run: npm run build -w @itharbors/kit-core

      - name: Select changed Kits
        id: selection
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              ;;
            merge_group)
              base_sha="$MERGE_GROUP_BASE_SHA"
              ;;
            push)
              base_sha="$PUSH_BEFORE_SHA"
              if [[ "$base_sha" =~ ^0{40}$ ]]; then
                base_sha="$(git rev-list --max-parents=0 --max-count=1 "$HEAD_SHA")"
              fi
              ;;
            *)
              echo "Unsupported GitHub event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          selector_output="$(node scripts/select-kit-ci.mjs "$base_sha" "$HEAD_SHA")"
          matrix_json=''
          has_kits=''
          while IFS= read -r line; do
            case "$line" in
              MATRIX_JSON=*)
                test -z "$matrix_json"
                matrix_json="${line#MATRIX_JSON=}"
                ;;
              HAS_KITS=true|HAS_KITS=false)
                test -z "$has_kits"
                has_kits="${line#HAS_KITS=}"
                ;;
              *)
                echo 'Selector emitted an invalid output record' >&2
                exit 1
                ;;
            esac
          done <<< "$selector_output"
          test -n "$matrix_json"
          test -n "$has_kits"
          git cat-file -e "$base_sha^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          printf 'matrix-json=%s\nhas-kits=%s\nbase-sha=%s\nhead-sha=%s\n' \
            "$matrix_json" "$has_kits" "$base_sha" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate Kit release intent
        shell: bash
        env:
          BASE_SHA: ${{ steps.selection.outputs.base-sha }}
          HEAD_SHA: ${{ steps.selection.outputs.head-sha }}
        run: |
          set -euo pipefail
          release_output="$(node scripts/plan-kit-releases.mjs "$BASE_SHA" "$HEAD_SHA")"
          releases_json=''
          has_releases=''
          while IFS= read -r line; do
            case "$line" in
              RELEASES_JSON=*)
                test -z "$releases_json"
                releases_json="${line#RELEASES_JSON=}"
                ;;
              HAS_RELEASES=true|HAS_RELEASES=false)
                test -z "$has_releases"
                has_releases="${line#HAS_RELEASES=}"
                ;;
              *)
                echo 'Release planner emitted an invalid output record' >&2
                exit 1
                ;;
            esac
          done <<< "$release_output"
          test -n "$releases_json"
          test -n "$has_releases"
          printf '### Kit release intent\n\n`%s`\n' "$releases_json" >> "$GITHUB_STEP_SUMMARY"

  check-kit:
    needs: select
    if: needs.select.outputs.has-kits == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix-json).include }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Build Kit lifecycle dependencies
        run: npm run build -w @itharbors/kit-core -w @itharbors/kit-cli -w @itharbors/plugin-types -w @itharbors/server

      - name: Audit selected Kit architecture
        run: npm run kits:boundary -- "${{ matrix.kit }}"

      - name: Validate selected Kit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-kit-matrix.mjs check "${{ matrix.kit }}"
