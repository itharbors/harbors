<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ITHARBORS Kit 管理</title>
    <link rel="stylesheet" href="./kit-manager.css">
  </head>
  <body>
    <div class="dock-shell">
      <aside class="dock-mark" aria-label="ITHARBORS">
        <span class="dock-mark__monogram" aria-hidden="true">H</span>
        <span class="dock-mark__track" aria-hidden="true"></span>
        <span class="dock-mark__caption">VERIFIED KITS</span>
        <span class="sr-only">仅限已验证 Kit</span>
      </aside>

      <main id="manager-main" aria-busy="false">
        <header class="dock-header">
          <div>
            <p class="eyebrow">扩展管理</p>
            <h1>Kit 管理</h1>
            <div class="header-intro">
              <p class="lede">安装已验证的 Kit，并安全切换本机版本。</p>
              <span id="installed-count" class="installed-count">0 个已安装</span>
            </div>
          </div>
          <div class="registry-console" aria-live="polite">
            <span class="registry-console__lamp" aria-hidden="true"></span>
            <div>
              <strong id="registry-status">正在加载 Kit 仓库…</strong>
              <span id="registry-detail">正在检查最近验证的仓库快照。</span>
            </div>
            <button id="refresh-button" class="button button--quiet" type="button">刷新</button>
          </div>
        </header>

        <div id="registry-notice" class="notice" role="status" hidden></div>
        <div id="operation-status" class="operation-status" role="status" aria-live="polite"></div>

        <section id="manager-workspace" class="manager-workspace" data-mobile-view="list">
          <aside class="kit-browser" aria-label="Kit 列表">
            <div class="kit-browser__toolbar">
              <label class="search-field">
                <span class="sr-only">搜索 Kit</span>
                <input id="kit-search" type="search" placeholder="搜索 Kit">
              </label>
              <div class="filter-tabs" role="tablist" aria-label="Kit 筛选">
                <button type="button" data-filter="all" aria-selected="true">全部</button>
                <button type="button" data-filter="installed" aria-selected="false">已安装</button>
                <button type="button" data-filter="updates" aria-selected="false">有更新</button>
              </div>
              <label class="channel-filter">
                <span>频道</span>
                <select id="channel-filter">
                  <option value="stable">稳定版</option>
                  <option value="preview">预览版</option>
                </select>
              </label>
            </div>
            <p id="kit-list-empty" class="kit-list-empty" hidden></p>
            <div id="kit-navigation" class="kit-navigation" role="listbox"></div>
          </aside>
          <section id="kit-detail" class="kit-detail" aria-live="polite">
            <div class="kit-detail__empty">
              <strong>选择一个 Kit</strong>
              <span>查看用途、权限和本机版本。</span>
            </div>
          </section>
        </section>

        <footer class="dock-footer">
          <strong>已发布版本不可变更。</strong>
          <span>安装、更新、停用、版本切换和删除会即时应用，打开的 Kit 窗口可能重新加载。</span>
        </footer>
      </main>
    </div>
    <script type="module" src="./kit-manager-renderer.mjs"></script>
  </body>
</html>
