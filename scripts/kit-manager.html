<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ITHARBORS Kit 管理</title>
    <link rel="stylesheet" href="./kit-manager.css">
  </head>
  <body>
    <div class="dock-shell">
      <aside class="dock-mark" aria-label="ITHARBORS Kit 管理">
        <span class="dock-mark__brand">ITHARBORS</span>
        <span class="dock-mark__title" aria-hidden="true">KIT / 管理</span>
        <span class="dock-mark__rule"></span>
        <span class="dock-mark__caption">仅限已验证 Kit</span>
      </aside>

      <main id="manager-main" aria-busy="false">
        <header class="dock-header">
          <div>
            <p class="eyebrow">扩展管理</p>
            <h1>Kit 管理</h1>
            <p class="lede">立即安装已验证的 Kit，并在安全重启后切换启用版本。</p>
          </div>
          <div class="registry-console" aria-live="polite">
            <span class="registry-console__lamp" aria-hidden="true"></span>
            <div>
              <strong id="registry-status">正在加载 Kit 仓库…</strong>
              <span id="registry-detail">正在检查最近验证的仓库快照。</span>
            </div>
            <button id="refresh-button" class="button button--quiet" type="button">刷新</button>
          </div>
        </header>

        <div id="registry-notice" class="notice" role="status" hidden></div>
        <div id="operation-status" class="operation-status" role="status" aria-live="polite"></div>

        <section class="berth-section" aria-labelledby="stable-heading">
          <div class="section-heading">
            <div>
              <p class="eyebrow">发布通道</p>
              <h2 id="stable-heading">稳定版</h2>
            </div>
            <span class="section-heading__note">已审核版本 · 重启后安全启用</span>
          </div>
          <p id="stable-empty" class="empty-state" hidden></p>
          <div id="stable-list" class="kit-grid"></div>
        </section>

        <details id="preview-section" class="preview-section">
          <summary>
            <span>
              <span class="eyebrow">自选通道</span>
              <strong>预览版</strong>
            </span>
            <span class="preview-section__warning">内容可能随时变更</span>
          </summary>
          <section aria-label="预览版 Kit">
            <p id="preview-empty" class="empty-state" hidden>暂无预览版。</p>
            <div id="preview-list" class="kit-grid"></div>
          </section>
        </details>

        <footer class="dock-footer">
          <strong>已发布版本不可变更。</strong>
          <span>暂不支持卸载，以便安全保留工作区中的有效引用。</span>
        </footer>
      </main>
    </div>
    <script type="module" src="./kit-manager-renderer.mjs"></script>
  </body>
</html>
